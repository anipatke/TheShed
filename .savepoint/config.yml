# Savepoint config — single source of truth for project preferences.

schema_version: 2

quality_gates:
  lint: null  # no linter is installed; TypeScript strict mode is the static check
  typecheck: npm run typecheck
  build: npm run build
  test: npm test
  block_on_failure: true
  gate_timeout: 5m

theme:
  bg: "#121212"
  surface: "#0D0D0D"
  surface_2: "#0F0F0F"
  border: "#1A1A1A"
  text: "#F0E6DA"
  accents:
    backlog: "#B1A1DF"
    planned: "#B1A1DF"
    in_progress: "#FC6323"
    review: "#FC6323"
    done: "#A4C639"
    blocked: "#FF4444"
  borders: "subtle"
features:
  parallel_planning: true
